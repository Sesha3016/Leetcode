name: Validate C++ checker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-cpp-checks.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-cpp-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit and C++ smoke tests
        run: python -m unittest discover -s tests -v
